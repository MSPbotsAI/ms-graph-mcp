services:
  graph-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: graph-mcp:latest
    container_name: graph-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - GRAPH_BASE_URL=https://graph.microsoft.com/v1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
